name: release

# One tag produces every artefact coherently: static Linux tarballs,
# Debian packages (amd64/arm64), and checksums, assembled into a DRAFT
# GitHub release. Publishing the draft is a deliberate human action;
# publishing the release then triggers publish-crates.yml. Nothing here
# publishes to crates.io or any other registry.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.44.61
        with:
          tool: cross
      - name: Build release binaries
        run: |
          cross build --release --locked --target ${{ matrix.target }} \
            -p stile -p stile-brokerd
      - name: Package tarball
        run: |
          dir="stile-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$dir"
          cp "target/${{ matrix.target }}/release/stile" "dist/$dir/"
          cp "target/${{ matrix.target }}/release/stile-brokerd" "dist/$dir/"
          cp README.md THREAT_MODEL.md SECURITY.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - name: Package .deb
        run: |
          arch="$(case ${{ matrix.target }} in x86_64-*) echo amd64;; aarch64-*) echo arm64;; esac)"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          scripts/make-deb.sh "target/${{ matrix.target }}/release" \
            "dist/stile_${version}_${arch}.deb" "$arch" "$version"
      - name: Verify .deb (contents + install + boundary, clean container)
        run: |
          version="${GITHUB_REF_NAME#v}"
          IMAGE=debian:bookworm-slim bash scripts/test-deb.sh \
            "dist/stile_${version}_$( \
              case ${{ matrix.target }} in x86_64-*) echo amd64;; aarch64-*) echo arm64;; esac \
            ).deb" 2>/dev/null || \
          IMAGE=debian:trixie-slim bash scripts/test-deb.sh \
            "dist/stile_${version}_$( \
              case ${{ matrix.target }} in x86_64-*) echo amd64;; aarch64-*) echo arm64;; esac \
            ).deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.deb > SHASUMS256.txt
      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHASUMS256.txt
