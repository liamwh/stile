name: release

# Manual-triggered artifact build. Creates a DRAFT GitHub release with
# binaries and checksums; publishing it is a deliberate human action.
# Nothing here publishes to crates.io or any other registry.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: true
          - target: aarch64-unknown-linux-musl
            use-cross: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use-cross
        run: cargo install --locked cross
      - name: Build release binaries
        run: |
          cargo cross build --release --locked --target ${{ matrix.target }} \
            -p stile -p stile-brokerd
      - name: Package
        run: |
          dir="stile-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}"
          mkdir -p "dist/$dir"
          cp "target/${{ matrix.target }}/release/stile" "dist/$dir/"
          cp "target/${{ matrix.target }}/release/stile-brokerd" "dist/$dir/"
          cp README.md THREAT_MODEL.md SECURITY.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHASUMS256.txt
      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHASUMS256.txt
