name: release

# One tag produces every artefact coherently: static Linux tarballs,
# Debian packages (amd64/arm64), and checksums, assembled into a DRAFT
# GitHub release. Publishing the draft is a deliberate human action;
# publishing the release then triggers publish-crates.yml. Nothing here
# publishes to crates.io or any other registry.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.44.61
        with:
          tool: cross
      - name: Build release binaries
        run: |
          cross build --release --locked --target ${{ matrix.target }} \
            -p stile -p stile-brokerd
      - name: Package tarball
        run: |
          dir="stile-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$dir"
          cp "target/${{ matrix.target }}/release/stile" "dist/$dir/"
          cp "target/${{ matrix.target }}/release/stile-brokerd" "dist/$dir/"
          cp README.md THREAT_MODEL.md SECURITY.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - name: Package .deb
        run: |
          arch="$(case ${{ matrix.target }} in x86_64-*) echo amd64;; aarch64-*) echo arm64;; esac)"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          scripts/make-deb.sh "target/${{ matrix.target }}/release" \
            "dist/stile_${version}_${arch}.deb" "$arch" "$version"
      - name: Verify .deb (contents + install + boundary, clean container)
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(case ${{ matrix.target }} in x86_64-*) echo amd64;; aarch64-*) echo arm64;; esac)"
          # amd64 runs the full lifecycle test on the native container;
          # arm64 (cross-arch on the runner) runs structural checks.
          bash scripts/test-deb.sh "dist/stile_${version}_${arch}.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.deb > SHASUMS256.txt
      - name: Draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3.3.0.3.3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHASUMS256.txt
