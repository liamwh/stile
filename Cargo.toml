[workspace]
resolver = "2"
members = [
    "crates/stile-protocol",
    "crates/stile-core",
    "crates/stile-brokerd",
    "crates/stile",
    "crates/integration",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "Apache-2.0"
repository = "https://github.com/liamwh/stile"

[workspace.dependencies]
# Internal crates carry both path (workspace builds) and version
# (crates.io publishes) so `cargo publish` can rewrite them.
stile-protocol = { path = "crates/stile-protocol", version = "0.1.1" }
stile-core = { path = "crates/stile-core", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "allow" # libc FFI only; every block must carry a SAFETY comment
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
